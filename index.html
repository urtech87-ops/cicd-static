<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI/CD Practice</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #1F4E4A;
      color: #fff;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.08);
      padding: 3rem 4rem;
      border-radius: 16px;
    }
    h1 { margin: 0 0 0.5rem; }
    .version { opacity: 0.7; font-size: 0.9rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>My CI/CD Pipeline Works</h1>
    <p>Deployed to Azure via GitHub Actions.</p>
    <p class="version">Version 1.0</p>
  </div>
</body>
</html>
